<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f212d"/>
      <stop offset="60%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3d52"/>
      <stop offset="50%" stop-color="#242634"/>
      <stop offset="100%" stop-color="#181922"/>
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#4facfe"/>
      <stop offset="75%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Orbit Secondary Glow -->
    <linearGradient id="orbitGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Core Hub Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232636"/>
      <stop offset="100%" stop-color="#14151f"/>
    </linearGradient>

    <!-- Core Stroke Gradient -->
    <linearGradient id="coreStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Status Beacon Gradient -->
    <radialGradient id="beaconGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#shadowFilter)"/>

  <!-- Inner Subtle Grid Accent Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="32" y1="180" x2="480" y2="180"/>
    <line x1="32" y1="256" x2="480" y2="256"/>
    <line x1="32" y1="332" x2="480" y2="332"/>
    <line x1="180" y1="32" x2="180" y2="480"/>
    <line x1="256" y1="32" x2="256" y2="480"/>
    <line x1="332" y1="32" x2="332" y2="480"/>
  </g>

  <!-- Background Orbit Glow Behind Core -->
  <g transform="translate(256, 256) rotate(-26)">
    <ellipse cx="0" cy="0" rx="172" ry="72" fill="none" stroke="url(#orbitGlow)" stroke-width="22" filter="url(#glowPurple)"/>
  </g>

  <!-- Orbital Track (Lower Arc - Behind Core) -->
  <g transform="translate(256, 256) rotate(-26)">
    <path d="M -172,0 A 172 72 0 0 1 172,0" fill="none" stroke="url(#orbitGrad)" stroke-width="7" stroke-dasharray="14 10" opacity="0.45"/>
  </g>

  <!-- Central Infrastructure Core Hub -->
  <g filter="url(#shadowFilter)">
    <!-- Hub Shadow & Body -->
    <rect x="180" y="180" width="152" height="152" rx="36" ry="36" fill="url(#coreGrad)" stroke="url(#coreStroke)" stroke-width="4.5"/>
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="185" y="185" width="142" height="142" rx="31" ry="31" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
    
    <!-- Central Brand Glyph 'O' -->
    <circle cx="256" cy="256" r="38" fill="none" stroke="url(#glyphGrad)" stroke-width="13" stroke-linecap="round"/>
    <!-- Inner Core Dot -->
    <circle cx="256" cy="256" r="9" fill="url(#orbitGrad)"/>
  </g>

  <!-- Orbital Track (Upper Arc - Foreground Over Core) -->
  <g transform="translate(256, 256) rotate(-26)">
    <path d="M 172,0 A 172 72 0 0 1 -172,0" fill="none" stroke="url(#orbitGrad)" stroke-width="8.5" stroke-linecap="round"/>
    
    <!-- Primary Orbital Telemetry Satellite (Glowing Cyan Node) -->
    <g transform="translate(132, 46)" filter="url(#glowCyan)">
      <circle cx="0" cy="0" r="13" fill="#00f2fe"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
      <!-- Trajectory rings -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Secondary Satellite Node -->
    <g transform="translate(-142, -41)">
      <circle cx="0" cy="0" r="8" fill="#a855f7"/>
      <circle cx="0" cy="0" r="4" fill="#f3e8ff"/>
    </g>
  </g>

  <!-- Live Health / Daemon Status Beacon (Bottom Right of Core) -->
  <g transform="translate(320, 320)">
    <!-- Outer Pulse Ring -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.4"/>
    <!-- Deep Shield Ring -->
    <circle cx="0" cy="0" r="15" fill="#14151f" stroke="#1a1c28" stroke-width="3"/>
    <!-- Emerald Active Dot -->
    <circle cx="0" cy="0" r="10" fill="url(#beaconGrad)"/>
    <!-- Core Light Point -->
    <circle cx="-3" cy="-3" r="3" fill="#ecfdf5" opacity="0.8"/>
  </g>
</svg>