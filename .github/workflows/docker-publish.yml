name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional image version tag override'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Multi-Arch Build & Publish (amd64 / arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DOCKERHUB_USERNAME
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Resolve Docker Hub User
        id: dockerhub-config
        shell: bash
        run: |
          DOCKER_USER=$(echo "${DOCKER_USERNAME:-moresonsun}" | tr '[:upper:]' '[:lower:]' | xargs)
          echo "docker_user=$DOCKER_USER" >> $GITHUB_OUTPUT
          echo "docker_image=${DOCKER_USER}/orbit" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------------
      # 1. GHCR Publish (Guaranteed to succeed via GITHUB_TOKEN)
      # ----------------------------------------------------------------------
      - name: Extract GHCR metadata (tags & labels)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.description=Self-hosted Docker Infrastructure Management & Real-Time Monitoring Platform
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push multi-arch to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # 2. Docker Hub Publish (Reuses cached layers instantly)
      # ----------------------------------------------------------------------
      - name: Extract Docker Hub metadata (tags & labels)
        id: meta-dockerhub
        if: env.DOCKER_USERNAME != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dockerhub-config.outputs.docker_image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.description=Self-hosted Docker Infrastructure Management & Real-Time Monitoring Platform
            org.opencontainers.image.vendor=${{ steps.dockerhub-config.outputs.docker_user }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Push multi-arch to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
